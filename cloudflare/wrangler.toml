# Cloudflare Worker configuration for cowork-tunnel.
#
# Setup, from this directory:
#   1. npm install                      # installs the pinned wrangler
#   2. npx wrangler login
#   3. npx wrangler secret put RELAY_TOKEN
#   4. npx wrangler deploy
#
# On a headless box, step 2 does not work: `wrangler login` starts an OAuth
# callback server on localhost that your browser cannot reach. Create an API
# token with the "Edit Cloudflare Workers" template instead and pass it as
# CLOUDFLARE_API_TOKEN.
#
# Secrets survive a deploy. `wrangler deploy` replaces the script and the
# [vars] block below; it does not touch RELAY_TOKEN, so step 3 is a one-time
# action. Check with `npx wrangler secret list` (names only, never values).
#
# Generate a token:
#   python3 -c "import secrets; print(secrets.token_urlsafe(32))"

name = "cowork-tunnel"
main = "worker.js"
compatibility_date = "2024-09-23"

# Workers Logs. Without this there is no signal at all when a tunnel fails.
[observability]
enabled = true

[vars]
DEFAULT_PORT = "22"

# --- Access control ---------------------------------------------------------
#
# RELAY_TOKEN is the only thing between the internet and an arbitrary-host TCP
# proxy running on your Cloudflare account. Set it with
#   wrangler secret put RELAY_TOKEN
# never as a plain var here, which would commit it to the repo. Rotate it the
# moment you think it has leaked.
#
# By default any target host and port is reachable. The two settings below can
# narrow that if you want them; both are optional and off by default.
#
# ALLOWED_HOSTS: only these targets are reachable (exact, case-insensitive host
# match). An entry here also exempts that host from BLOCK_PRIVATE, so
# allowlisting an internal host does work.
# ALLOWED_HOSTS = "server1.com,server2.com,192.168.1.5"
#
# BLOCK_PRIVATE: refuse targets that look private or loopback. This is a
# lexical check on the target string and does not resolve DNS, so treat it as a
# guardrail against typos rather than a security boundary.
# BLOCK_PRIVATE = "1"
#
# --- HTTP proxy ------------------------------------------------------------
#
# MAX_RESPONSE_BODY: largest upstream response the /proxy path will return, in
# bytes. Defaults to 33554432 (32 MiB), matching the self-hosted relay. The
# body is held three times over while it is base64-encoded, so an uncapped
# forward of a large download exhausts the isolate's 128 MB and dies with no
# diagnostic; past the cap the caller gets a 502 naming the limit instead.
# MAX_RESPONSE_BODY = "33554432"

# Custom domain (optional, requires DNS setup)
# [[routes]]
# pattern = "tunnel.yourdomain.com/*"
# zone_name = "yourdomain.com"

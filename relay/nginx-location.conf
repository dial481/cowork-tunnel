# Add this location block inside your server {} block.
# The relay listens on localhost:8765 by default.
#
# For standalone mode:
#   Client connects to: wss://your-server.com/ssh?token=xxx
#
# For universal mode:
#   Client connects to: wss://your-server.com/ssh?target=host:22&token=xxx

location /ssh {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;

    # WebSocket upgrade headers
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;

    # The client sends the token in the query string, because some proxies
    # strip Authorization headers. nginx logs the full request line by default,
    # which writes the token to disk in cleartext on every connection. Turn the
    # log off here, or use a log_format that drops the query string.
    access_log off;

    # Long timeouts for SSH sessions
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # No buffering for interactive sessions
    proxy_buffering off;
}

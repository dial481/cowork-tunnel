# Add these location blocks inside your server {} block.
#
# The universal relay listens on TWO local ports:
#   8765 - WebSocket/SSH   (websockets owns this port directly)
#   8766 - HTTP proxy      (/proxy and /health)
#
# Clients only ever see 443. nginx terminates TLS and routes by path, so the
# split is invisible to them.
#
# For standalone mode:
#   Client connects to: wss://your-server.com/ssh?token=xxx
#   standalone.py is SSH-only and listens on one port; it has no /proxy.
#
# For universal mode:
#   SSH:  wss://your-server.com/ssh?target=host:22&token=xxx
#   HTTP: POST https://your-server.com/proxy (with Bearer token)

location /ssh {
    proxy_pass http://127.0.0.1:8765;
    proxy_http_version 1.1;

    # WebSocket upgrade
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # SSH sessions idle. Without these nginx closes the tunnel after 60s.
    proxy_read_timeout 7d;
    proxy_send_timeout 7d;

    # The token is in the query string; keep it out of the access log.
    access_log off;

    # No buffering for interactive sessions
    proxy_buffering off;
}

# HTTP proxy endpoint. The relay handles auth via the Authorization header,
# so no token appears in the query string here. Keep access_log off anyway
# since the Authorization header is logged by some log_format directives.
#
# Note the different upstream port: this is the relay's HTTP listener, not the
# WebSocket one. Sending /proxy to 8765 gets you a 426 from websockets.
location /proxy {
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    access_log off;

    # Short timeouts -- these are individual HTTP round-trips, not tunnels.
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    # Allow request bodies up to 8 MiB (matches the relay's MAX_PROXY_BODY).
    #
    # This bounds the JSON envelope, not the payload inside it. A binary body
    # travels base64-encoded, which costs about a third more, so 8m here means
    # roughly 6 MiB of actual upload. Raise both this and MAX_PROXY_BODY if you
    # need more, and keep them in step -- if nginx's limit is the lower of the
    # two, the caller gets nginx's HTML 413 instead of the relay's JSON error.
    client_max_body_size 8m;
}

# Optional: expose the relay's health check.
location /health {
    proxy_pass http://127.0.0.1:8766;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    access_log off;
}

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: python3 tests/test_all.py

  # bootstrap.sh branches on whether python3 can already import websockets. The
  # job above installs it into the interpreter it then runs the suite with, so
  # it only ever exercises the "already present" side. This job covers the
  # other one: the suite runs from a venv while the python3 on PATH has no
  # websockets, which is what a fresh host looks like and what drives
  # bootstrap into building its own venv.
  bootstrap-without-websockets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Confirm the python3 on PATH cannot import websockets
        run: |
          if python3 -c "import websockets" 2>/dev/null; then
            echo "PATH python3 already has websockets; this job would duplicate the one above" >&2
            exit 1
          fi
          echo "confirmed: python3 on PATH has no websockets"
      - name: Run the suite from a venv
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
          .venv/bin/python tests/test_all.py

  # requirements.txt declares a floor; installing only the newest release would
  # never prove the floor still works. This job pins it explicitly.
  websockets-floor:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        websockets-version: ["14.1", "15.0"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned websockets
        run: |
          python -m pip install --upgrade pip
          pip install "websockets==${{ matrix.websockets-version }}"
      - name: Run test suite
        run: python3 tests/test_all.py

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint bootstrap.sh
        run: shellcheck client/bootstrap.sh

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Syntax-check the Cloudflare Worker
        run: node --check worker.js
        working-directory: cloudflare

      - name: Run the Worker test suite
        run: node tests/test_worker.mjs
